function decodeJwtPayload(token) {
    try {
        const parts = token.split(".");

        if (parts.length !== 3) {
            throw new Error("Invalid JWT format");
        }

        const base64Url = parts[1];

        const base64 = base64Url
            .replace(/-/g, "+")
            .replace(/_/g, "/");

        const jsonPayload = decodeURIComponent(
            atob(base64)
                .split("")
                .map(function (c) {
                    return "%" +
                        ("00" + c.charCodeAt(0).toString(16)).slice(-2);
                })
                .join("")
        );

        return JSON.parse(jsonPayload);

    } catch (error) {
        console.error("JWT decode failed:", error);
        return null;
    }
}
// Named distinctly from script.js's AES_KEY_B64 to avoid a duplicate global const declaration.
const DEMO_AES_KEY_B64 = "el+1+epeGlCquCYLsk3zyQTsq3KUKQKL9QcV0B9KIS8=";

// Reverse of script.js's encryptPayload: strips the 12-byte IV prefix and
// AES-GCM decrypts the remainder, returning the parsed JSON body.
async function decryptPayload(base64Cipher) {
    const keyBytes = Uint8Array.from(atob(DEMO_AES_KEY_B64), c => c.charCodeAt(0));
    const cryptoKey = await crypto.subtle.importKey("raw", keyBytes, "AES-GCM", false, ["decrypt"]);

    const combined = Uint8Array.from(atob(base64Cipher), c => c.charCodeAt(0));
    const iv = combined.slice(0, 12);
    const cipherBytes = combined.slice(12);

    const plainBuffer = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, cryptoKey, cipherBytes);
    const plainText = new TextDecoder().decode(plainBuffer);

    return JSON.parse(plainText);
}

async function mapConsentFormResponse(apiResponse) {

    if (!apiResponse || !apiResponse.response) {
        throw new Error("Invalid API response");
    }

    const jwtPayload = decodeJwtPayload(apiResponse.response.payload);

    if (!jwtPayload) {
        throw new Error("Unable to decode consent payload");
    }

    console.log("Decoded JWT Payload:", jwtPayload);

    const responseWrapper = jwtPayload.data && jwtPayload.data.response;

    if (!responseWrapper) {
        throw new Error("Consent form data not found");
    }

    const payloadEncryptionEnabled = !!responseWrapper.payloadEncryptionEnabled;

    // When encryption is enabled, responseWrapper.data is a base64 AES-GCM blob
    // instead of the plain { response: [...] } object.
    const innerData = payloadEncryptionEnabled
        ? await decryptPayload(responseWrapper.data)
        : responseWrapper.data;

    const consentData =
        innerData?.response?.[0] ||
        responseWrapper?.response?.[0];

    if (!consentData) {
        throw new Error("Consent form data not found");
    }

    return { consentData, payloadEncryptionEnabled };
}
