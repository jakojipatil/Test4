<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;}
.login-box{width:420px;max-width:90%;margin:100px auto;background:#fff;padding:30px;
border-radius:8px;box-shadow:0 0 12px rgba(0,0,0,.15);box-sizing:border-box;}
h2{text-align:center;margin-bottom:25px;}
input{width:100%;padding:12px;margin:8px 0 15px;border:1px solid #ccc;border-radius:5px;box-sizing:border-box;}
button{width:100%;padding:12px;background:#007bff;color:#fff;border:0;border-radius:5px;
font-size:16px;cursor:pointer;}
button:hover{opacity:.9;}
#error{color:#d00;margin-top:12px;text-align:center;}
</style>
</head>
<body>
<div class="login-box">
<h2>Login</h2>
<input type="email" id="email" placeholder="Enter Email" autocomplete="username">
<input type="password" id="password" placeholder="Enter Password" autocomplete="current-password">
<button type="button" onclick="login()">Login</button>
<div id="error"></div>
</div>

<script>
function login(){
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if(email === "" || password === ""){
        document.getElementById("error").textContent = "Enter Email and Password";
        return;
    }

    // Dummy authentication for testing only.
    localStorage.setItem("loggedIn", "true");
    localStorage.setItem("email", email);

    // IMPORTANT: after login, open the consent page.
    window.location.href = "consent.html";
}
</script>
</body>
</html>
